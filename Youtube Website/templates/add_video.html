<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tamil Polyglot Premnath</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='add_video.css') }}">
</head>

<body>

    <header>
        <nav>
            <div>
                <img src="{{url_for('static', filename='image/logo.jpg')}}" alt="Logo">
                <h2>Tamil Polyglot Premnath | Manage Content</h2>
            </div>

            <div class="page">
                <a href="/content">Add Videos</a>
                <a href="/managevideos">Manage Videos</a>
            </div>
            <a href="/login">
                <button style="background-color: white;" onclick="return confirmLogout()">Logout</button>
            </a>
        </nav>
    </header>

    <div class="container">

        <!-- Add Videos -->
        <div class="card">
            <h2>Add New Video</h2>
            <form action="/add_content" method="POST" enctype="multipart/form-data">

                <input type="text" name="title" placeholder="Video Title" required><br><br>

                <textarea name="description" placeholder="Description" required></textarea><br><br>

                <input type="text" name="link" placeholder="Video/Resource Link" required><br><br>

                <input type="file" name="image" accept="image/*" required style="cursor: pointer;"><br><br>

                <button type="submit" class="btn"
                    onclick="return handleAdd()">Add Video</button>
            </form>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 Tamil Polyglot Premnath</p>
    </footer>

    <script>
        function confirmLogout() {
            let result = confirm("Are you sure you want to logout?");
            if (result) {
                alert("Logged out successfully!");
                return true;
            } else {
                return false;
            }
        }

        function confirmDelete() {
            return confirm("Are you sure you want to delete this content?");
        }

        function handleAdd() {
            let confirmAdd = confirm("Are you sure you want to add this video?");

            if (confirmAdd) {
                alert("✅ Video added successfully!");
                return true;  // submit form
            } else {
                return false; // cancel
            }
        }
    </script>

</body>

</html>
