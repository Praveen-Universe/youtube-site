<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil Polyglot Premnath</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='feedback.css') }}">
</head>
<body>
    <header>
        <nav>
            <div>
                <img src="{{url_for('static', filename='image/logo.jpg')}}" alt="Logo">
                <h2>Tamil Polyglot Premnath | User Feedback</h2>
            </div>

            <div class="page">
                <a href="/users">User Details</a>
                <a href="/feedback">User Feedback</a>
            </div>
            <a href="/login">
                <button style="background-color: white;" onclick="return confirmLogout()">Logout</button>
            </a>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <h1>User Feedback</h1>
            <center>
                <table border="1" width="100%">
                    <tr>
                        <th>S.No</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Message</th>
                        <th>Actions</th>
                    </tr>
                    {% for feedback in feedbacks %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ feedback[1] }}</td>
                        <td>{{ feedback[2] }}</td>
                        <td>{{ feedback[3] }}</td>
                        <td>
                            <a href="/delete_feedback/{{ feedback[0] }}"
                                onclick="return confirm('Are you sure you want to delete this feedback?')">
                                <button class="delete">Delete ❌</button>
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </table>
            </center>
        </div>
    </div>

    <script>
        function confirmLogout() {
            let logoutConfirm = confirm('Are you sure you want to logout?');
            
            if (logoutConfirm) {
                alert("✅ Logged out successfully!");
            }
            return logoutConfirm;
        }
    </script>

    <footer>
        <p>&copy; 2026 Tamil Polyglot Premnath</p>
    </footer>
</body>
</html>
